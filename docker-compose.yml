version: '3.8'

services:
    web:
        container_name: web-${NAME_PROJECT}
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - 80:80
            - 8080:8080
        volumes:
            - ./src:/var/www/html/
            - ~/.ssh:/home/docker/.ssh
        environment:
            VIRTUAL_HOST: local.${NAME_PROJECT}.com
            VIRTUAL_PORT: 80
            PHP_EXTENSION_GD: 1
            PHP_EXTENSION_INTL: 1
            PHP_EXTENSION_IMAGICK: 1
            APACHE_EXTENSION_HEADERS: 1
            APACHE_EXTENSION_PROXY: 1
            APACHE_EXTENSION_PROXY_HTTP: 1
            DB_HOST: mysql
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            SSO_JWT_PUBLIC_KEY: ${SSO_JWT_PUBLIC_KEY}
            SSO_JWT_ISSUER: ${SSO_JWT_ISSUER}
            SSO_JWT_AUDIENCE: ${SSO_JWT_AUDIENCE}
            SSO_LOGOUT_URL: ${SSO_LOGOUT_URL}
            WP_DEBUG: ${WP_DEBUG}
            REACT_APP_CDN_URL: ${REACT_APP_CDN_URL}
        depends_on:
            - mysql

    mysql:
        container_name: mysql-${NAME_PROJECT}
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        ports:
            - 3306:3306
        volumes:
            - mysql_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${SQL_PASS}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}

    phpmyadmin:
        container_name: phpmyadmin-${NAME_PROJECT}
        image: phpmyadmin/phpmyadmin:latest
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${SQL_PASS}
        ports:
            - 8081:80
        depends_on:
            - mysql

volumes:
    mysql_data:
