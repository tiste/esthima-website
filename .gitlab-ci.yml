image: node:16

cache:
  paths:
    - node_modules/

deploy-recette:
  before_script:
    - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.36.0/install.sh | bash
    - ". ~/.nvm/nvm.sh"
    - nvm install v16.20.2
    - nvm use v16.20.2
    - node --version
  environment:
    name: stage
    url: recette.esthima.com
  only:
    - stage
  tags:
    - esthima.fr-recette
  script:
    - root=$(pwd)
    - theme_path="/var/www/html/wp-content/themes/esthima/"
    - plugin_path="/var/www/html/wp-content/plugins"
    - upload_path="/var/www/html/wp-content/uploads"
    - cd ./src/wp-content/themes/esthima/ && npm i && npm run prod
    - rm -rf ./node_modules
    - echo "OK"
    - currentRelease=$(date +%s)
    - cd $root
    - mkdir /var/www/releases/tmp_release
    - cp -r ./src/wp-content/themes/esthima/* /var/www/releases/tmp_release
    #- rm -d /var/www/html/wp-content/themes/esthima
    - mv /var/www/releases/current_release /var/www/releases/${currentRelease}
    - mv /var/www/releases/tmp_release /var/www/releases/current_release
    #- ln -snf /var/www/releases/current_release /var/www/html/wp-content/themes/esthima
    # - cd /var/www/releases/ && ls -dt */ | tail -n +4 | xargs rm -rf
    - echo "✅ Déploiement terminé. Envoi de la notification à Google Chat..."
    - |
      if [ -z "$CHAT_WEBHOOK_URL" ]; then
        echo "❌ CHAT_WEBHOOK_URL est vide. Aucune notification envoyée."
        exit 1
      fi

      curl -X POST -H "Content-Type: application/json" \
      --data "{
        \"cards\": [
          {
            \"header\": {
              \"title\": \"🚀 Déploiement réussi\",
              \"subtitle\": \"${CI_PROJECT_NAME}\",
              \"imageUrl\": \"https://cdn-icons-png.flaticon.com/512/190/190411.png\",
              \"imageStyle\": \"AVATAR\"
            },
            \"sections\": [
              {
                \"widgets\": [
                  {
                    \"keyValue\": {
                      \"topLabel\": \"Environnement\",
                      \"content\": \"${DEPLOY_ENV}\",
                      \"icon\": \"DESCRIPTION\"
                    }
                  },
                  {
                    \"keyValue\": {
                      \"topLabel\": \"Pipeline\",
                      \"content\": \"${CI_PIPELINE_URL}\",
                      \"icon\": \"DESCRIPTION\"
                    }
                  },
                  {
                    \"keyValue\": {
                      \"topLabel\": \"Auteur\",
                      \"content\": \"${GITLAB_USER_NAME}\",
                      \"icon\": \"PERSON\"
                    }
                  }
                ]
              }
            ]
          }
        ]
      }" "$CHAT_WEBHOOK_URL"
