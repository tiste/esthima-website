image: node:16

cache:
  paths:
    - node_modules/
deploy-stage-krealid:
  environment:
    name: stage-krealid
    url: esthima.krealid.com
  only:
    - stage-krealid
  script:
    - apt-get update
    - apt-get -y --force-yes install zip unzip rsync php npm sshpass
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo $SSH_PRIVATE_KEY
    - root=$(pwd)
    - theme_path=${root}"/src/wp-content/themes/esthima/"
    - plugin_path=${root}"/src/wp-content/plugins"
    - upload_path=${root}"/src/wp-content/uploads"
    - exclude_path=${root}"/src/wp-content/themes/esthima/_private/cmd/rsync_exclude.txt"
    - include_path=${root}"/src/wp-content/themes/esthima/_private/cmd/rsync_include.txt"
    - cd ./src/wp-content/themes/esthima/ && npm i && npm run prod
    - rm -rf ./node_modules
    - currentRelease=$(date +%s)
    # Theme
    - rsync -avutzP --info=progress2 -e 'ssh -p 2121' --include-from ${include_path} --exclude-from ${exclude_path} ${theme_path} preprod-c1572d@nc1183.nexylan.net:~/releases/tmp_release &> /dev/null
    # Plugins
    #- rsync -avutzcIP --info=progress2 -e 'ssh -p 2121' --include-from ${include_path} --exclude-from ${exclude_path} ${plugin_path} preprod-c1572d@nc1183.nexylan.net:~/htdocs/wp-content
    # Uploads
    #- rsync -avutzcIP --info=progress2 -e 'ssh -p 2121' --include-from ${include_path} --exclude-from ${exclude_path} ${upload_path} preprod-c1572d@nc1183.nexylan.net:~/htdocs/wp-content
    # Creation lien symbolique
    - ssh -tt preprod-c1572d@nc1183.nexylan.net -p 2121 "rm -d ~/htdocs/wp-content/themes/esthima && mv ~/releases/current_release ~/releases/${currentRelease} && mv ~/releases/tmp_release ~/releases/current_release && ln -snf ~/releases/current_release ~/htdocs/wp-content/themes/esthima && cd ~/releases/ && ls -dt */ | tail -n +4 | xargs rm -rf"
deploy-recette:
  environment:
    name: stage
    url: recette.esthima.com
  only:
    - stage
  tags:
    - esthima.fr-recette
  script:
    - root=$(pwd)
    - theme_path="/var/www/html/wp-content/themes/esthima/"
    - plugin_path="/var/www/html/wp-content/plugins"
    - upload_path="/var/www/html/wp-content/uploads"
    - curl -s https://deb.nodesource.com/setup_16.x
    - sudo apt-get install nodejs -y | sudo bash -
    - cd ./src/wp-content/themes/esthima/ && npm i && npm run prod
    - rm -rf ./node_modules
    - currentRelease=$(date +%s)
    - cd $root
    - mkdir /var/www/releases/tmp_release
    - cp -r ./src/wp-content/themes/esthima/* /var/www/releases/tmp_release
    #- rm -d /var/www/html/wp-content/themes/esthima
    - mv /var/www/releases/current_release /var/www/releases/${currentRelease}
    - mv /var/www/releases/tmp_release /var/www/releases/current_release
    #- ln -snf /var/www/releases/current_release /var/www/html/wp-content/themes/esthima
    # - cd /var/www/releases/ && ls -dt */ | tail -n +4 | xargs rm -rf
    - nvm list
deploy-production:
  environment:
    name: main
    url: esthima.com
  only:
    - main
  tags:
    - esthima.fr-production
  script:
    - root=$(pwd)
    - theme_path="/var/www/html/wp-content/themes/esthima/"
    - plugin_path="/var/www/html/wp-content/plugins"
    - upload_path="/var/www/html/wp-content/uploads"
    - cd ./src/wp-content/themes/esthima/ && npm i && npm run prod
    - rm -rf ./node_modules
    - currentRelease=$(date +%s)
    - cd $root
    - mkdir /var/www/releases/tmp_release
    - cp -r ./src/wp-content/themes/esthima/* /var/www/releases/tmp_release
    #- rm -d /var/www/html/wp-content/themes/esthima
    - mv /var/www/releases/current_release /var/www/releases/${currentRelease}
    - mv /var/www/releases/tmp_release /var/www/releases/current_release
    #- ln -snf /var/www/releases/current_release /var/www/html/wp-content/themes/esthima
    # - cd /var/www/releases/ && ls -dt */ | tail -n +4 | xargs rm -rf